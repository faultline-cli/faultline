id: hardcoded-secret
title: Hardcoded secret, token, or password in source code
category: silent_failure
severity: high
detector: source
base_score: 1.1
tags: [source, security, secret, credentials, owasp]
domain: source
class: silent-failure
mode: hardcoded-secret
context_filters:
  path_includes: [.go, .js, .ts, .py, .rb, .java, .sh, .env, .yaml, .yml, .json]
  path_excludes: [playbooks/, docs/, fixtures/, internal/engine/testdata/, _test.go, tests/, test/, .example, .sample]
source:
  triggers:
    - id: secret_assignment
      label: string literal assigned to a secret-named variable
      patterns:
        - "APIKey ="
        - "api_key ="
        - "API_KEY ="
        - "apiKey ="
        - "secret ="
        - "SECRET ="
        - "password ="
        - "PASSWORD ="
        - "Password ="
        - "token ="
        - "TOKEN ="
        - "access_token ="
        - "private_key ="
        - "PRIVATE_KEY ="
        - "client_secret ="
        - "CLIENT_SECRET ="
        - "auth_token ="
      weight: 1.3
    - id: high_entropy_string
      label: long base64 or hex string literal
      patterns:
        - "\"sk_live_"
        - "\"sk_test_"
        - "\"ghp_"
        - "\"github_pat_"
        - "\"xoxb-"
        - "\"xoxp-"
        - "\"AKIA"
      weight: 1.5
  mitigations:
    - id: env_lookup
      label: value read from environment variable
      patterns:
        - "os.Getenv("
        - "os.LookupEnv("
        - "process.env."
        - "ENV["
        - "ENV.fetch("
        - "System.getenv("
        - "getenv("
      weight: 4.0
    - id: vault_lookup
      label: value fetched from secrets manager
      patterns:
        - "vault."
        - "secretsmanager."
        - "ssm.GetParameter"
        - "getSecret("
        - "fetchSecret("
      weight: 4.0
    - id: placeholder_value
      label: placeholder or example value
      patterns:
        - "YOUR_"
        - "<your-"
        - "REPLACE_ME"
        - "example"
        - "placeholder"
        - "changeme"
      weight: 3.0
  compound_signals:
    - id: secret_with_high_entropy
      label: secret-named variable assigned a high-entropy string literal
      require: [secret_assignment, high_entropy_string]
      scope: file
      bonus: 2.5
      required: false
  safe_context:
    - id: test_files_safer
      label: test-only path
      paths: [_test.go, tests/, test/, spec/]
      discount: 2.0
    - id: examples_safer
      label: example or sample file
      paths: [examples/, example/, .example, .sample, docs/]
      discount: 3.0
summary: |-
  A secret-named variable is assigned a literal string value in source code, exposing credentials, API keys, or tokens to anyone with repository access.
diagnosis: |-
  ## Diagnosis

  A variable whose name suggests it holds a secret (API key, token, password,
  or credential) is assigned a literal string directly in source code.

  Hardcoded secrets are committed to version control, visible in PR diffs,
  and persist in git history even after removal. This affects the security of
  all environments where the secret is valid.

  Common patterns:
  - `const APIKey = "sk_live_..."` in Go config or init files
  - `API_KEY = "..."` in Python settings modules
  - `token: "..."` in YAML configuration committed to the repo
fix: |-
  ## Fix steps

  1. Remove the literal secret value from source code immediately.
  2. Replace it with an environment variable lookup: `os.Getenv("API_KEY")` in
     Go, `process.env.API_KEY` in Node.js, `ENV["API_KEY"]` in Ruby, etc.
  3. Store the actual secret in CI secrets, a secrets manager (Vault, AWS SSM,
     GCP Secret Manager), or an `.env` file that is in `.gitignore`.
  4. If the secret has already been committed, rotate it — git history is
     permanent and the exposed value should be treated as compromised.
  5. Add a `git-secrets` or `trufflehog` pre-commit hook to catch future leaks.
validation: |-
  ## Validation

  - Re-run `faultline inspect .` or `faultline guard .`.
  - Confirm the finding is resolved and the secret is loaded from the environment.
  - Run `git log -p | grep -i api_key` to confirm the literal is not present in
    committed history.
scoring:
  blast_radius_bonus: 1.5
  hot_path_bonus: 1.0
why_it_matters: |-
  ## Why it matters

  Hardcoded secrets are one of the most common causes of credential compromise in
  open-source and private repositories alike. A single exposed key can give an
  attacker full access to a production system, a cloud account, or a third-party
  API — often without any log of the intrusion. Even private repositories expose
  secrets to all collaborators and any tool with read access.
workflow:
  likely_files:
    - config.go
    - config.py
    - settings.py
    - config.js
    - config.ts
    - .env
    - docker-compose.yml
  local_repro:
    - faultline inspect .
    - "rg -n 'api_key|API_KEY|secret|token|password' --type go --type py --type js"
  verify:
    - faultline guard .
