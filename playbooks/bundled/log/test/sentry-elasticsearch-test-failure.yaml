id: sentry-elasticsearch-test-failure
title: Sentry Elasticsearch integration test failure
category: test
severity: high
base_score: 1.0
tags: [sentry, elasticsearch, python, django, integration-test, search]
stage_hints: [test]
domain: test-runner
class: test-framework-failure
mode: sentry-elasticsearch-test-failure
summary: |-
  An Elasticsearch integration test in the Sentry error-tracking project failed.
  These tests exercise the Elasticsearch-backed search and grouping pipeline.
  Failures typically indicate that the Elasticsearch service is unreachable,
  a mapping conflict exists, or the index was not initialised before the suite ran.
diagnosis: |-
  ## Diagnosis

  The `ElasticSearchTest` suite validates Sentry's Elasticsearch backend for
  querying and filtering error groups. The tests cover:

  - `test_first_seen_date_filter` / `test_last_seen_date_filter` — temporal range
    filtering on event timestamps.
  - `test_limit_and_offset` — pagination of search results.
  - `test_project` — project-scoped search isolation.
  - `test_query` — full-text query against event titles and messages.
  - `test_sort` — ordering results by frequency, last-seen, or priority.
  - `test_status` — filtering by resolved/unresolved group status.
  - `test_tags` — tag-based faceted filtering.

  When all tests in this class fail together the most likely cause is:

  - **Elasticsearch not running in CI** — the service was not started or failed to
    bind before the test runner launched.
  - **Index not created** — the setup step that creates the Sentry index and applies
    the mapping did not run or was skipped.
  - **ES version mismatch** — the ES client library expects a different API version
    than the server provides (e.g., ES 2.x client against an ES 5.x server).
  - **Connection refused** — the ES host/port configured for tests
    (`SENTRY_INDEXES` or `ELASTICSEARCH_URL`) does not match the running service.

  A single failing test (rather than the full class) usually points to a query
  logic regression rather than a connectivity problem.
fix: |-
  ## Fix steps

  1. Confirm Elasticsearch is running and reachable before tests execute:
     ```bash
     curl -s http://localhost:9200/_cluster/health | python -m json.tool
     ```

  2. If using Docker Compose, ensure the `elasticsearch` service starts before
     the test step:
     ```yaml
     services:
       elasticsearch:
         image: elasticsearch:2.4
         ports:
           - "9200:9200"
     ```

  3. Re-create the index and apply the mapping:
     ```bash
     python manage.py migrate --settings=sentry.conf.server
     ```
     Or, for the legacy index command:
     ```bash
     python manage.py create_index --settings=sentry.conf.server
     ```

  4. Check the Elasticsearch URL configured for the test environment:
     ```bash
     grep -r ELASTICSEARCH_URL sentry/conf/
     grep -r SENTRY_INDEXES sentry/conf/
     ```

  5. Verify ES client and server version compatibility:
     ```bash
     python -c "import elasticsearch; print(elasticsearch.__version__)"
     curl -s http://localhost:9200/ | python -m json.tool
     ```

  6. Run only the failing class to confirm the root cause in isolation:
     ```bash
     python -m pytest tests/search/test_backends.py -k ElasticSearchTest -v
     ```

validation: |-
  ## Validation

  - `curl http://localhost:9200/_cluster/health` reports `green` or `yellow`.
  - `python -m pytest tests/search/test_backends.py -k ElasticSearchTest -v`
    passes all 8 test methods.
match:
  any:
    - "ElasticSearchTest.test_first_seen_date_filter"
    - "ElasticSearchTest.test_last_seen_date_filter"
    - "ElasticSearchTest.test_limit_and_offset"
    - "ElasticSearchTest.test_project"
    - "ElasticSearchTest.test_sort"
    - "ElasticSearchTest.test_status"
    - "ElasticSearchTest.test_tags"
workflow:
  likely_files:
    - sentry/search/backends.py
    - sentry/search/elasticsearch.py
    - tests/search/test_backends.py
    - sentry/conf/server.py
  local_repro:
    - curl -s http://localhost:9200/_cluster/health
    - python -m pytest tests/search/test_backends.py -k ElasticSearchTest -v
  verify:
    - python -m pytest tests/search/test_backends.py -k ElasticSearchTest -v
why_it_matters: |-
  ## Why it matters

  Sentry's Elasticsearch backend is the path for querying large event volumes when
  the database backend would be too slow. All eight methods in the suite failing
  simultaneously is a strong signal that the service is unreachable rather than a
  code regression, which makes this triageable without reading Python tracebacks.

  ## Prevention

  - Add an explicit health-check step in CI that waits for Elasticsearch to
    become ready before running the test suite.
  - Pin the `elasticsearch-py` client to a version range compatible with the
    Elasticsearch server image used in CI.
  - Gate Elasticsearch-dependent tests behind a pytest marker (e.g.,
    `@pytest.mark.elasticsearch`) so they can be skipped on machines without a
    running ES instance.
